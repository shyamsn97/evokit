# An evokit task. `evokit status --task THIS_FOLDER --dir EXPERIMENT_DIR` creates an experiment
# (seeded with the genome files below) or continues it. In Python: `evokit.Task.from_directory("THIS_FOLDER")`.

task:
  genome: [main.py]             # the files that evolve (glob patterns); everything else is the fixed environment
  evaluate: python evaluate.py  # run in a copy of this folder; see evaluate.py for the contract
  timeout: 2m
  objective: score              # the metric evaluate.py prints that the archive ranks by
  minimize: false
  # ignore: [data/cache/**]     # files that are neither genome nor environment

# recipe:                       # what `evokit run THIS_FOLDER` runs, with its options
#   name: avo                   # avo | autoresearch | dgm | ... | FILE.py:NAME
#   agent: claude               # claude (Claude Code), or a command run in the agent's folder
#   max_cost: 5
