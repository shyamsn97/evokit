site_name: EvoKit
site_description: Evolutionary search where the variation operator can be a coding agent.
repo_url: https://github.com/shyamsn97/evokit
repo_name: shyamsn97/evokit
edit_uri: edit/main/docs/
copyright: Copyright (c) 2026 Shyam Sudhakaran

nav:
  - Home: index.md
  - Primitives: primitives.md
  - Agents: agents.md
  - Recipes:
      - recipes.md
      - autoresearch: recipes/autoresearch.md
      - AVO: recipes/avo.md
      - OpenEvolve: recipes/openevolve.md
      - ShinkaEvolve: recipes/shinka.md
      - Darwin Gödel Machine: recipes/dgm.md
      - DGM-Hyperagents: recipes/hyperagents.md
      - A generational GA: recipes/ga.md
      - EvoRLM (experimental): recipes/evorlm.md
  - Tasks: tasks.md
  - Reading runs: reading-runs.md

# Working notes from earlier designs; their code no longer matches the library.
exclude_docs: |
  research/
  design/
  examples/
  references/

theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - admonition
  - def_list
  - tables
  - toc:
      permalink: "#"
