<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="headLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <style>
      .h { font-size: 16px; font-weight: 600; fill: #1f2328; }
      .n { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12.5px; fill: #656d76; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #1f2328; }
      .a { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .t { stroke: #8c959f; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
      .box { fill: #ffffff; stroke: #d0d7de; }
    </style>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>

  <!-- search -->
  <rect x="40.5" y="40.5" width="520" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="72" class="h">Experiment</text>
  <text x="160" y="72" class="s">ask(), tell(), and run(evaluate)</text>

  <rect x="70.5" y="110.5" width="150" height="70" rx="10" class="box"/>
  <text x="145.5" y="140" text-anchor="middle" class="n">Strategy</text>
  <text x="145.5" y="160" text-anchor="middle" class="s">selects</text>

  <rect x="320.5" y="110.5" width="150" height="70" rx="10" class="box"/>
  <text x="395.5" y="140" text-anchor="middle" class="n">Operator</text>
  <text x="395.5" y="160" text-anchor="middle" class="s">creates</text>

  <rect x="70.5" y="230.5" width="150" height="70" rx="10" class="box"/>
  <text x="145.5" y="260" text-anchor="middle" class="n">Archive</text>
  <text x="145.5" y="280" text-anchor="middle" class="s">keeps survivors</text>

  <line x1="145.5" y1="229" x2="145.5" y2="185" class="t" marker-end="url(#headLight)"/>
  <text x="155" y="212" class="s">reads</text>

  <line x1="221" y1="145.5" x2="316" y2="145.5" class="a" marker-end="url(#head)"/>
  <text x="268" y="135" text-anchor="middle" class="s">selected</text>

  <!-- evaluator -->
  <rect x="640.5" y="110.5" width="210" height="70" rx="10" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="745.5" y="140" text-anchor="middle" class="n">evaluate</text>
  <text x="745.5" y="160" text-anchor="middle" class="s">your function</text>
  <text x="745.5" y="305" text-anchor="middle" class="s">outside the experiment: a thread,</text>
  <text x="745.5" y="322" text-anchor="middle" class="s">an executor, Modal, Ray, ...</text>

  <!-- ask -->
  <line x1="471" y1="145.5" x2="636" y2="145.5" class="a" marker-end="url(#head)"/>
  <text x="555" y="135" text-anchor="middle" class="code">ask()</text>
  <text x="555" y="166" text-anchor="middle" class="s">new individual</text>

  <!-- tell -->
  <path d="M745.5,181 V265.5 H225" class="a" marker-end="url(#head)"/>
  <text x="600" y="255" text-anchor="middle" class="code">tell(individual, fitness)</text>

  <line x1="395.5" y1="262" x2="395.5" y2="185" class="t" marker-end="url(#headLight)"/>
  <text x="405" y="230" class="s">admitted?</text>

  <text x="40" y="378" class="s">tell() adds the individual to the archive, then tells the strategy and the operator whether it was admitted.</text>
</svg>
