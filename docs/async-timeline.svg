<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <style>
      .lane { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12.5px; fill: #656d76; }
      .create { fill: #ddf4ff; stroke: #54aeff; }
      .eval { fill: #dafbe1; stroke: #4ac26b; }
      .tick { fill: #1f2328; }
    </style>
  </defs>

  <rect width="900" height="300" fill="#ffffff"/>

  <!-- worker 1 -->
  <text x="40" y="79" class="lane">worker 1</text>
  <rect x="150" y="60" width="4" height="28" class="tick"/>
  <rect x="155.5" y="60.5" width="224" height="27" rx="5" class="create"/>
  <rect x="381.5" y="60.5" width="88" height="27" rx="5" class="eval"/>
  <rect x="471" y="60" width="4" height="28" class="tick"/>
  <rect x="477" y="60" width="4" height="28" class="tick"/>
  <rect x="482.5" y="60.5" width="157" height="27" rx="5" class="create"/>
  <rect x="641.5" y="60.5" width="118" height="27" rx="5" class="eval"/>
  <rect x="761" y="60" width="4" height="28" class="tick"/>

  <!-- worker 2 -->
  <text x="40" y="129" class="lane">worker 2</text>
  <rect x="165" y="110" width="4" height="28" class="tick"/>
  <rect x="170.5" y="110.5" width="129" height="27" rx="5" class="create"/>
  <rect x="301.5" y="110.5" width="118" height="27" rx="5" class="eval"/>
  <rect x="421" y="110" width="4" height="28" class="tick"/>
  <rect x="427" y="110" width="4" height="28" class="tick"/>
  <rect x="432.5" y="110.5" width="267" height="27" rx="5" class="create"/>
  <rect x="701.5" y="110.5" width="98" height="27" rx="5" class="eval"/>
  <rect x="801" y="110" width="4" height="28" class="tick"/>

  <!-- worker 3 -->
  <text x="40" y="179" class="lane">worker 3</text>
  <rect x="180" y="160" width="4" height="28" class="tick"/>
  <rect x="185.5" y="160.5" width="334" height="27" rx="5" class="create"/>
  <rect x="521.5" y="160.5" width="78" height="27" rx="5" class="eval"/>
  <rect x="601" y="160" width="4" height="28" class="tick"/>
  <rect x="607" y="160" width="4" height="28" class="tick"/>
  <rect x="612.5" y="160.5" width="147" height="27" rx="5" class="create"/>
  <rect x="761.5" y="160.5" width="88" height="27" rx="5" class="eval"/>
  <rect x="851" y="160" width="4" height="28" class="tick"/>

  <!-- time axis -->
  <line x1="150" y1="212.5" x2="860" y2="212.5" stroke="#8c959f" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="860" y="230" text-anchor="end" class="s">time</text>

  <!-- legend -->
  <rect x="40" y="254" width="4" height="16" class="tick"/>
  <rect x="47" y="254" width="4" height="16" class="tick"/>
  <text x="60" y="267" class="s">select / tell: quick state changes</text>
  <rect x="300.5" y="254.5" width="28" height="15" rx="4" class="create"/>
  <text x="338" y="267" class="s">create_individual: the operator (LLM, agent)</text>
  <rect x="620.5" y="254.5" width="28" height="15" rx="4" class="eval"/>
  <text x="658" y="267" class="s">evaluate: the evaluator</text>
</svg>
