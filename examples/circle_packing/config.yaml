# Circle packing as an evokit task. From examples/circle_packing:
#   evokit status --task . --dir runs/x          # creates an experiment (seeded with main.py), then continues it
#   evokit run . --dir runs/avo                  # runs the recipe below with Claude Code
# The scripts in algorithms/ load this folder with `evokit.Task.from_directory` and run the published algorithms.

task:
  genome: [main.py]
  evaluate: python evaluate.py
  timeout: 5m
  objective: score
  minimize: false
  ignore: [algorithms/**, compare.py]

recipe:
  name: avo
  agent: claude
  max_cost: 5
