# Circle packing as an evokit task. From examples/circle_packing:
#   evokit status --task . --dir runs/x        # creates the run (seeded with main.py), then continues it
# The scripts in algorithms/ load this folder with `evokit.load_task` and run the published algorithms.

task:
  genome: [main.py]
  evaluate: python evaluate.py
  timeout: 5m
  objective: score
  minimize: false
  ignore: [algorithms/**, compare.py]

run:                            # what the CLI builds: you (or your agent) are the operator
  archive: best
  strategy: greedy
  operator: none
  # operator: coding-agent      # or let Claude Code make each change: `evokit run --dir runs/x`
  # agent: claude
